# Blueprint de Render para el Sistema de Control de Acceso (API + Web Administrativa + Landing).
# - scaccess-api: contenedor Docker gratuito (se suspende tras 15 minutos sin trafico).
# - accesa-admin: Static Site gratuito por CDN (sin suspension ni consumo de horas).
# - accesa-landing: Static Site gratuito por CDN para el sitio promocional (sin suspension ni consumo de horas).
# Documentacion: docs/DEVELOPMENT.md, apps/admin/README.md y docs/adr/0013-docker-containerization.md
services:
  - type: web
    name: scaccess-api
    runtime: docker
    plan: free
    # La imagen se construye con el Dockerfile multi-etapa de la raiz del
    # monorepo. El propio Dockerfile fija node:22-alpine, compila TypeScript y
    # define el CMD; por eso no se usan buildCommand, startCommand ni
    # NODE_VERSION con runtime: docker.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Coincide con el puerto expuesto por la imagen y con el HEALTHCHECK.
      - key: PORT
        value: 3000
      # Origenes permitidos para la web administrativa (sin ruta /login ni barra final).
      - key: CORS_ORIGIN
        value: https://accesa-admin.onrender.com,http://localhost:5173
      # Valores secretos: Render los solicita al crear el servicio y no los
      # sincroniza con otros servicios del Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: accesa-admin
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build:admin
    staticPublishPath: ./apps/admin/dist
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: VITE_API_BASE_URL
        value: https://scaccess-api.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://vomjmyqxbqgndndvpaqb.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: accesa-landing
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build:landing
    staticPublishPath: ./apps/landing/dist
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
