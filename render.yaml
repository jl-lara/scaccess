# Blueprint de Render para el backend del Sistema de Control de Acceso.
# Plan gratuito: el servicio se suspende tras 15 minutos de inactividad.
# Documentacion: docs/DEVELOPMENT.md
services:
  - type: web
    name: scaccess-api
    runtime: node
    plan: free
    # --include=dev instala TypeScript y la CLI de Prisma aunque Render defina
    # NODE_ENV=production durante el build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      # Valores secretos: Render los solicita al crear el servicio y no los
      # sincroniza con otros servicios del Blueprint.
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
